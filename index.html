<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iPhone Simulator</title>
<link rel="stylesheet" href="style.css?v=9"></head>
<body><div class="page"><main class="workspace"><section class="phone-wrap" aria-label="交互手机模拟器"><div class="phone"><div class="screen" id="screen"><div class="wallpaper" id="wallpaper"></div><div class="status"><span id="clock">9:41</span><button class="island" id="island-lock" aria-label="锁定手机屏幕" title="点击灵动岛锁屏"></button><div class="signals"><span>▂▄▆</span><span>◔</span><span class="battery"></span></div></div><div class="home-pages" id="home-pages" tabindex="0" aria-label="主屏幕，左右滑动翻页"><section class="home home-page" aria-label="第一页"><div class="widgets"><button class="weather-wide" data-open="天气" aria-label="打开芝加哥天气"><div class="weather-wide-top"><div><b>Chicago <span>➤</span></b><div class="weather-wide-temp">19°</div></div><div class="weather-wide-condition"><span class="weather-moon">☾<sup>✦</sup></span><b>Drizzle</b><small>H:22° L:16°</small></div></div><div class="weather-hourly"><div><span>22</span><b>☾<sup>✦</sup></b><strong>16°</strong></div><div><span>23</span><b>☾<sup>✦</sup></b><strong>15°</strong></div><div><span>00</span><b>☾<sup>✦</sup></b><strong>15°</strong></div><div><span>01</span><b>☾<sup>✦</sup></b><strong>14°</strong></div><div><span>02</span><b>☾<sup>✦</sup></b><strong>14°</strong></div><div><span>03</span><b>☾<sup>✦</sup></b><strong>13°</strong></div></div></button></div><div class="apps" id="apps"></div></section><section class="home home-page" aria-label="第二页"><div class="apps" id="apps-second"></div></section></div><nav class="dots" aria-label="主屏幕分页"><button class="page-dot active" aria-label="第1页" aria-current="page" data-page="0"></button><button class="page-dot" aria-label="第2页" data-page="1"></button></nav><div class="dock" id="dock"></div><section class="app-view" id="app-view" aria-label="应用内容"></section><section class="lock" id="lock" aria-label="锁屏"><div class="lock-face" id="lock-face"><div class="lock-symbol" aria-hidden="true"><svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path d="M7 10V7a5 5 0 0110 0v3M6 10h12v11H6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="15" r="1.3" fill="currentColor"/></svg></div><div id="lock-date"></div><div class="lock-time" id="lock-time"></div><div class="lock-charms" aria-hidden="true"><span>★</span><span><svg viewBox="0 0 32 36" width="29" height="32" aria-hidden="true"><path d="M10 15C4-1 11-2 13 12c0-15 9-15 6 2 8 2 9 10 4 14 5 4-7 7-10 2-8 2-13-4-9-8 0-4 3-6 6-7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="11" cy="20" r="1" fill="currentColor"/><circle cx="19" cy="20" r="1" fill="currentColor"/><path d="M13 24q3 2 5 0" fill="none" stroke="currentColor"/></svg></span></div><div class="lock-moon" aria-hidden="true">☾</div><div class="lock-shortcuts"><button id="lock-flashlight" aria-label="切换手电筒" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8v5l-2 3v10h-4V11L8 8zM8 6h8M11 13h2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></button><button id="lock-camera" aria-label="打开锁屏相机"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h5l2-3h4l2 3h5v13H3z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="13" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button></div><button class="unlock" id="unlock">向上轻扫以解锁</button></div><div id="passcode-panel" hidden><span class="passcode-lock" aria-hidden="true"><svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path d="M7 10V7a5 5 0 0110 0v3M6 10h12v11H6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="15" r="1.3" fill="currentColor"/></svg></span><h2>输入密码</h2><p id="passcode-status" role="status">输入四位密码以解锁</p><div class="passcode-dots" id="passcode-dots" aria-label="已输入0位密码"><span></span><span></span><span></span><span></span></div><div class="passcode-keypad" id="passcode-keypad"></div><div class="passcode-actions"><button id="passcode-cancel">取消</button><button id="passcode-delete">删除</button></div></div></section><div id="home-gesture-zone" aria-hidden="true"></div><button class="home-indicator" id="home" aria-label="返回主屏幕"></button><div class="toast" id="toast" role="status"></div></div></div><div class="under-phone" hidden>iPhone</div></section><aside class="controls" hidden><div class="control-title">让它更像你</div><div class="panel"><div class="panel-head"><span>壁纸风格</span><span id="wallpaper-name">暮光紫</span></div><div class="swatches"><button class="swatch active" aria-label="暮光紫" data-wall="0"></button><button class="swatch" aria-label="海盐蓝" data-wall="1"></button><button class="swatch" aria-label="落日粉" data-wall="2"></button><button class="swatch" aria-label="苔原绿" data-wall="3"></button></div></div><div class="panel"><div class="panel-head"><span>屏幕亮度</span><span id="brightness-value">100%</span></div><input id="brightness" aria-label="屏幕亮度" type="range" min="40" max="100" value="100"><div class="range-label"><span>☼</span><span>☀</span></div></div><button class="action" id="lock-button"><span>♙ &nbsp; 锁定屏幕</span><span>↗</span></button><button class="action" id="reset"><span>↻ &nbsp; 返回主屏幕</span><span>⌘ H</span></button><div class="tip"><strong>✧ &nbsp; 小提示</strong>点击应用图标打开应用，<br>轻点底部横条，随时回到主屏幕。<br>试试备忘录，记下此刻的灵感。</div></aside></main></div>
<script src="chat-data.js?v=9" defer></script><script src="script.js?v=9" defer></script><script src="chat-engine.js?v=9" defer></script></body></html>
