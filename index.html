<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iPhone Simulator</title>
<link rel="stylesheet" href="style.css?v=4"></head>
<body><div class="page"><main class="workspace"><section class="phone-wrap" aria-label="交互手机模拟器"><div class="phone"><div class="screen" id="screen"><div class="wallpaper" id="wallpaper"></div><div class="status"><span id="clock">9:41</span><button class="island" id="island-lock" aria-label="锁定手机屏幕" title="点击灵动岛锁屏"></button><div class="signals"><span>▂▄▆</span><span>◔</span><span class="battery"></span></div></div><div class="home-pages" id="home-pages" tabindex="0" aria-label="主屏幕，左右滑动翻页"><section class="home home-page" aria-label="第一页"><div class="widgets"><button class="widget weather" data-open="天气"><div class="city">北京市</div><div class="temp">23°</div><small>☀ &nbsp; 晴朗<br>最高 26° &nbsp; 最低 17°</small></button><button class="widget calendar" data-open="日历"><div class="day" id="widget-day">星期二</div><div class="date" id="widget-date">3</div><small>今天，留一点时间给自己。</small></button></div><div class="apps" id="apps"></div></section><section class="home home-page" aria-label="第二页"><div class="apps" id="apps-second"></div></section></div><nav class="dots" aria-label="主屏幕分页"><button class="page-dot active" aria-label="第1页" aria-current="page" data-page="0"></button><button class="page-dot" aria-label="第2页" data-page="1"></button></nav><div class="dock" id="dock"></div><section class="app-view" id="app-view" aria-label="应用内容"></section><div class="lock" id="lock"><div id="lock-date"></div><div class="lock-time" id="lock-time"></div><div style="font-size:24px;margin-top:15px">⌑</div><button class="unlock" id="unlock">轻点解锁 ↑</button></div><button class="home-indicator" id="home" aria-label="返回主屏幕"></button><div class="toast" id="toast" role="status"></div></div></div><div class="under-phone" hidden>iPhone</div></section><aside class="controls" hidden><div class="control-title">让它更像你</div><div class="panel"><div class="panel-head"><span>壁纸风格</span><span id="wallpaper-name">暮光紫</span></div><div class="swatches"><button class="swatch active" aria-label="暮光紫" data-wall="0"></button><button class="swatch" aria-label="海盐蓝" data-wall="1"></button><button class="swatch" aria-label="落日粉" data-wall="2"></button><button class="swatch" aria-label="苔原绿" data-wall="3"></button></div></div><div class="panel"><div class="panel-head"><span>屏幕亮度</span><span id="brightness-value">100%</span></div><input id="brightness" aria-label="屏幕亮度" type="range" min="40" max="100" value="100"><div class="range-label"><span>☼</span><span>☀</span></div></div><button class="action" id="lock-button"><span>♙ &nbsp; 锁定屏幕</span><span>↗</span></button><button class="action" id="reset"><span>↻ &nbsp; 返回主屏幕</span><span>⌘ H</span></button><div class="tip"><strong>✧ &nbsp; 小提示</strong>点击应用图标打开应用，<br>轻点底部横条，随时回到主屏幕。<br>试试备忘录，记下此刻的灵感。</div></aside></main></div>
<script src="script.js?v=4" defer></script></body></html>
